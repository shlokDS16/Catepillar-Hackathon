<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotter · phone check</title>
<style>
  /* Stand-alone page for the B0b phone check: no app CSS on purpose. */
  html { background: #f2f0ea; color: #16150f; font: 500 18px/1.45 system-ui, sans-serif; }
  body { margin: 0; padding: 16px; max-width: 480px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 8px; }
  p { margin: 0 0 16px; }
  button { display: block; width: 100%; min-height: 108px; margin: 0 0 24px; border: 3px solid #16150f;
           background: #16150f; color: #fff; font: 700 26px/1 system-ui, sans-serif; border-radius: 0; }
  button:active { background: #4b483f; }
  #log { border-top: 2px solid #16150f; padding-top: 12px; white-space: pre-wrap; font-size: 15px; }
</style>
</head>
<body>
<h1>Spotter · phone check</h1>
<p>Open this over HTTPS on the demo phone (Android Chrome). Tap each button once.</p>
<button id="vibrate" type="button">Vibrate</button>
<button id="play" type="button">Play sound</button>
<div id="log" aria-live="polite"></div>
<script>
  var log = document.getElementById("log");
  function line(text) { log.textContent += text + "\n"; }
  line("secure context: " + window.isSecureContext);
  line("navigator.vibrate: " + (typeof navigator.vibrate === "function"));

  document.getElementById("vibrate").addEventListener("click", function () {
    if (typeof navigator.vibrate !== "function") { line("Vibrate: not supported"); return; }
    var ok = navigator.vibrate([400, 200, 400]);
    line("Vibrate [400,200,400]: " + (ok ? "sent" : "refused"));
  });

  var ctx = null;
  document.getElementById("play").addEventListener("click", function () {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume().then(function () {
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.frequency.value = 880; gain.gain.value = 0.2;
        osc.connect(gain).connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.6);
        line("Play: audio context " + ctx.state);
      });
    } catch (e) { line("Play: " + e.message); }
  });
</script>
</body>
</html>
